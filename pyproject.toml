[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hondana"
version = "0.1.0"
description = "Fold Japanese/CJK book metadata for matching (簡繁・新旧字体・かな・全半角) and look up ISBNs with openBD → NDL → Google Books → Open Library fallback."
readme = "README.en.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["japanese", "cjk", "isbn", "openbd", "ndl", "normalization", "kyujitai", "library", "bibliography"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Japanese",
  "Natural Language :: Chinese (Simplified)",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/Jasonin2099/hondana"

[project.scripts]
hondana = "hondana.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hondana = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--doctest-modules"
testpaths = ["tests", "src/hondana"]
